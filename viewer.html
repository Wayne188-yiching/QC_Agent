<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Agent · 報告</title>
<style>
/* QC Agent · viewer
 * rule 1: all chrome is zero-chroma neutral — the UI must disappear
 * rule 2: chroma is reserved exclusively for severity + seam channels
 * rule 3: colour never carries meaning alone — shape + number always accompany
 */
:root{
  --c-void:oklch(11% 0 0); --c-paper:oklch(15% 0 0); --c-surface:oklch(19% 0 0);
  --c-raised:oklch(24% 0 0); --c-line:oklch(29% 0 0); --c-line-strong:oklch(42% 0 0);
  --c-text:oklch(93% 0 0); --c-text-dim:oklch(69% 0 0); --c-text-faint:oklch(52% 0 0);
  --c-stage:oklch(24% 0 0);
  --sev-1:oklch(64% 0.21 25); --sev-2:oklch(74% 0.16 62);
  --sev-3:oklch(84% 0.15 96); --sev-4:oklch(72% 0.13 235);
  --sev-1-bg:oklch(64% 0.21 25/.13); --sev-2-bg:oklch(74% 0.16 62/.13);
  --sev-3-bg:oklch(84% 0.15 96/.13); --sev-4-bg:oklch(72% 0.13 235/.13);
  --seam-a:oklch(78% 0.15 195); --seam-b:oklch(72% 0.20 330);
  --c-focus:oklch(80% 0.14 235);
  --font-ui:"IBM Plex Sans","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --text-micro:10.5px; --text-sm:11.5px; --text-base:13px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --radius-sm:3px; --radius-md:5px;
  --ease-out:cubic-bezier(.16,1,.3,1); --dur-fast:90ms;
  --h-topbar:40px; --h-status:26px; --h-timeline:104px;
  --w-source:236px; --w-issues:330px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--c-void);color:var(--c-text);font-family:var(--font-ui);
  font-size:var(--text-base);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:1px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.shell{height:100vh;display:grid;
  grid-template-columns:var(--w-source) minmax(0,1fr) var(--w-issues);
  grid-template-rows:var(--h-topbar) minmax(0,1fr) var(--h-status);
  grid-template-areas:"top top top" "src stage iss" "bar bar bar"}

.topbar{grid-area:top;display:flex;align-items:center;gap:var(--space-4);
  padding:0 var(--space-3);background:var(--c-paper);border-bottom:1px solid var(--c-line)}
.brand{display:flex;align-items:center;gap:var(--space-2);height:100%;
  padding-right:var(--space-3);border-right:1px solid var(--c-line)}
.brand b{font-weight:600;letter-spacing:.02em}
.asset .path{font-size:var(--text-sm);color:var(--c-text-faint)}
.tag{font-size:var(--text-micro);letter-spacing:.06em;padding:2px 6px;
  border:1px solid var(--c-line-strong);border-radius:var(--radius-sm);color:var(--c-text-dim)}
.spacer{margin-left:auto}
.seg{display:flex;background:var(--c-surface);border:1px solid var(--c-line);
  border-radius:var(--radius-md);padding:2px}
.seg button{padding:3px 9px;font-size:var(--text-sm);border-radius:var(--radius-sm);
  color:var(--c-text-dim);transition:background var(--dur-fast) var(--ease-out)}
.seg button:hover{color:var(--c-text)}
.seg button[aria-pressed=true]{background:var(--c-raised);color:var(--c-text)}

.src{grid-area:src;background:var(--c-paper);border-right:1px solid var(--c-line);
  display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;justify-content:space-between;padding:var(--space-2) var(--space-3);
  font-size:var(--text-micro);letter-spacing:.08em;text-transform:uppercase;
  color:var(--c-text-faint);border-bottom:1px solid var(--c-line);flex-shrink:0}
.tree{overflow-y:auto;flex:1;padding:var(--space-1) 0}
.node{display:flex;align-items:center;gap:var(--space-2);width:100%;text-align:left;
  padding:5px var(--space-3);color:var(--c-text-dim);
  transition:background var(--dur-fast) var(--ease-out)}
.node:hover{background:var(--c-surface)}
.node[aria-selected=true]{background:var(--c-raised);color:var(--c-text)}
.node .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .cnt{font-size:var(--text-micro);color:var(--c-text-faint)}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.d1{background:var(--sev-1)}.d2{background:var(--sev-2)}
.d3{background:var(--sev-3)}.d4{background:var(--sev-4)}
.meta{padding:var(--space-3);border-top:1px solid var(--c-line);flex-shrink:0;
  font-size:var(--text-sm);color:var(--c-text-faint);line-height:1.7}
.meta b{color:var(--c-text-dim);font-weight:400}

.stage{grid-area:stage;display:grid;
  grid-template-rows:minmax(0,1fr) var(--h-timeline);overflow:hidden}
.viewwrap{position:relative;background:var(--c-stage);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.viewbadge{position:absolute;top:var(--space-2);left:var(--space-2);
  display:flex;gap:var(--space-1);pointer-events:none}
.vb{font-size:var(--text-micro);letter-spacing:.05em;padding:2px 6px;
  border-radius:var(--radius-sm);background:oklch(11% 0 0/.74);color:var(--c-text-dim)}
.legend{position:absolute;top:var(--space-2);right:var(--space-2);display:none;
  flex-direction:column;gap:3px;font-size:var(--text-micro);
  background:oklch(11% 0 0/.8);padding:6px 8px;border-radius:var(--radius-sm)}
.legend.on{display:flex}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid currentColor;
  vertical-align:middle;margin-right:5px}
.empty{position:absolute;inset:0;display:grid;place-items:center;
  color:var(--c-text-faint);font-size:var(--text-sm);text-align:center;line-height:1.8}

.timeline{background:var(--c-paper);border-top:1px solid var(--c-line);
  display:grid;grid-template-rows:29px minmax(0,1fr);overflow:hidden}
.tlbar{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-3);
  border-bottom:1px solid var(--c-line)}
.transport{display:flex;gap:2px}
.transport button{width:24px;height:19px;display:grid;place-items:center;
  border-radius:var(--radius-sm);color:var(--c-text-dim);
  transition:background var(--dur-fast) var(--ease-out)}
.transport button:hover{background:var(--c-raised);color:var(--c-text)}
.transport svg{width:12px;height:12px}
.tc{font-size:var(--text-sm)}.tc span{color:var(--c-text-faint)}
.tlmeta{margin-left:auto;display:flex;gap:var(--space-3);
  font-size:var(--text-sm);color:var(--c-text-faint)}
.rail{position:relative;margin:var(--space-2) var(--space-3);cursor:ew-resize;
  touch-action:none;user-select:none}
.ruler{position:absolute;inset:0;display:flex;justify-content:space-between;
  font-size:var(--text-micro);color:var(--c-text-faint);
  border-top:1px solid var(--c-line);padding-top:3px}
.marker{position:absolute;top:20px;transform:translateX(-50%);
  transition:transform var(--dur-fast) var(--ease-out)}
.marker:hover{transform:translateX(-50%) translateY(-2px)}
.marker::before{content:"";position:absolute;top:-20px;left:50%;width:1px;height:20px;
  background:currentColor;opacity:.55}
.m1{color:var(--sev-1)}.m2{color:var(--sev-2)}
.m3{color:var(--sev-3)}.m4{color:var(--sev-4)}
.badge{display:inline-grid;place-items:center;width:15px;height:15px;flex-shrink:0;
  font-size:9.5px;font-weight:600;font-family:var(--font-mono);color:var(--c-void)}
.b1{background:var(--sev-1);border-radius:50%}
.b2{background:var(--sev-2);clip-path:polygon(50% 0,100% 100%,0 100%)}
.b3{background:var(--sev-3);border-radius:1px}
.b4{background:var(--sev-4);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--c-text);pointer-events:none}
.playhead::before{content:"";position:absolute;top:-2px;left:-3.5px;width:8px;height:8px;
  background:var(--c-text);clip-path:polygon(50% 100%,100% 0,0 0)}

.iss{grid-area:iss;background:var(--c-paper);border-left:1px solid var(--c-line);
  display:flex;flex-direction:column;overflow:hidden}
.filters{display:flex;gap:var(--space-1);padding:var(--space-2) var(--space-3);
  border-bottom:1px solid var(--c-line);flex-shrink:0}
.chip{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--radius-sm);
  border:1px solid var(--c-line);font-size:var(--text-sm);color:var(--c-text-dim);
  transition:background var(--dur-fast) var(--ease-out)}
.chip:hover{background:var(--c-surface)}
.chip[aria-pressed=true]{background:var(--c-raised);color:var(--c-text);border-color:var(--c-line-strong)}
.chip .sq{width:8px;height:8px;flex-shrink:0}
.s1{background:var(--sev-1);border-radius:50%}
.s2{background:var(--sev-2);clip-path:polygon(50% 0,100% 100%,0 100%)}
.s3{background:var(--sev-3)}
.s4{background:var(--sev-4);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.chip .n{font-family:var(--font-mono);font-size:var(--text-micro);color:var(--c-text-faint)}
.list{flex:1;overflow-y:auto}
.item{display:grid;grid-template-columns:15px minmax(0,1fr);gap:var(--space-2);
  width:100%;text-align:left;padding:var(--space-3);border-bottom:1px solid var(--c-line);
  border-left:2px solid transparent;transition:background var(--dur-fast) var(--ease-out)}
.item:hover{background:var(--c-surface)}
.item[aria-selected=true].i1{border-left-color:var(--sev-1);background:var(--sev-1-bg)}
.item[aria-selected=true].i2{border-left-color:var(--sev-2);background:var(--sev-2-bg)}
.item[aria-selected=true].i3{border-left-color:var(--sev-3);background:var(--sev-3-bg)}
.item[aria-selected=true].i4{border-left-color:var(--sev-4);background:var(--sev-4-bg)}
.item h3{margin:0 0 3px;font-size:var(--text-base);font-weight:500;line-height:1.35}
.item p{margin:0 0 5px;font-size:var(--text-sm);line-height:1.6;color:var(--c-text-dim);
  overflow-wrap:anywhere}
.item .mt{display:flex;flex-wrap:wrap;gap:var(--space-2);
  font-size:var(--text-micro);color:var(--c-text-faint)}
.item .rule{padding:1px 4px;border:1px solid var(--c-line);border-radius:2px}
.status{grid-area:bar;display:flex;align-items:center;gap:var(--space-4);
  padding:0 var(--space-3);background:var(--c-paper);border-top:1px solid var(--c-line);
  font-size:var(--text-sm);color:var(--c-text-faint)}
.status b{font-weight:400;color:var(--c-text-dim)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
      <b>QC Agent</b>
    </div>
    <div class="asset"><span id="assetName"></span> <span class="path" id="assetSpine"></span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="檢視模式">
      <button aria-pressed="true"  data-mode="play">逐格</button>
      <button aria-pressed="false" data-mode="seam">首尾疊圖</button>
      <button aria-pressed="false" data-mode="trail">軌跡</button>
    </div>
    <div class="seg" role="group" aria-label="顯示">
      <button aria-pressed="true"  data-flag="hideDead">只顯示可見部件</button>
    </div>
  </header>

  <nav class="src" aria-label="動畫">
    <div class="phead"><span>動畫</span><span class="num" id="animCount"></span></div>
    <div class="tree" id="animList" role="tree"></div>
    <div class="meta" id="assetMeta"></div>
  </nav>

  <main class="stage">
    <div class="viewwrap">
      <canvas id="cv"></canvas>
      <div class="viewbadge">
        <span class="vb" id="vbAnim"></span>
        <span class="vb">骨架線框</span>
        <span class="vb num" id="vbFps"></span>
      </div>
      <div class="legend" id="legend">
        <span style="color:var(--seam-a)"><i></i>第一格 t=0</span>
        <span style="color:var(--seam-b)"><i></i>最後一格</span>
        <span style="color:var(--sev-1)"><i></i>首尾偏差過大</span>
      </div>
      <div class="empty" id="emptyMsg" hidden></div>
    </div>

    <section class="timeline" aria-label="時間軸">
      <div class="tlbar">
        <div class="transport">
          <button id="prev" aria-label="上一格"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 5v14l-9-7 9-7zM7 5h2v14H7z"/></svg></button>
          <button id="play" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
          <button id="next" aria-label="下一格"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5l9 7-9 7V5zM15 5h2v14h-2z"/></svg></button>
        </div>
        <span class="tc num" id="tc"></span>
        <div class="tlmeta" id="tlmeta"></div>
      </div>
      <div class="rail" id="rail">
        <div class="ruler" id="ruler" aria-hidden="true"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </section>
  </main>

  <aside class="iss" aria-label="問題清單">
    <div class="filters" id="filters" role="group" aria-label="依嚴重度篩選"></div>
    <div class="list" id="issueList"></div>
  </aside>

  <footer class="status" id="status"></footer>
</div>

<script>
const DATA = /*__DATA__*/ null;

const SEV_NAME = {1:'必修',2:'要修',3:'確認',4:'參考'};
const CSS = getComputedStyle(document.documentElement);
const col = n => CSS.getPropertyValue(n).trim();

const state = {
  anim: null, frame: 0, mode: 'play', hideDead: true,
  sel: null, playing: false, sevOn: {1:true,2:true,3:true,4:true}
};

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------- setup ---------- */
$('assetName').textContent = DATA.asset;
$('assetSpine').textContent = '· Spine ' + DATA.spine;
$('assetMeta').innerHTML =
  '骨骼 <b>' + DATA.bones + '</b> · Slot <b>' + DATA.slots + '</b><br>' +
  '附件 <b>' + DATA.attachments + '</b><br>圖集 <b>' + DATA.atlas + '</b>';

const animNames = Object.keys(DATA.animations);
$('animCount').textContent = animNames.length + ' 支';

animNames.forEach(name => {
  const a = DATA.animations[name];
  const worst = DATA.findings.filter(f => f.anim === name)
                             .reduce((m,f) => Math.min(m, f.sev), 9);
  const n = DATA.findings.filter(f => f.anim === name).length;
  const b = document.createElement('button');
  b.className = 'node'; b.setAttribute('role','treeitem');
  b.innerHTML = '<span class="lbl"></span>' +
    (worst < 9 ? '<span class="dot d' + worst + '"></span>' : '') +
    '<span class="cnt num">' + a.duration.toFixed(2) + 's</span>' +
    (n ? '<span class="cnt num">' + n + '</span>' : '');
  b.querySelector('.lbl').textContent = name;
  b.onclick = () => selectAnim(name);
  b.dataset.anim = name;
  $('animList').appendChild(b);
});

/* ---------- issues ---------- */
[1,2,3,4].forEach(sev => {
  const n = DATA.findings.filter(f => f.sev === sev).length;
  if (!n) return;
  const b = document.createElement('button');
  b.className = 'chip'; b.setAttribute('aria-pressed','true');
  b.innerHTML = '<span class="sq s' + sev + '"></span>' + SEV_NAME[sev] +
                '<span class="n">' + n + '</span>';
  b.onclick = () => { state.sevOn[sev] = !state.sevOn[sev];
    b.setAttribute('aria-pressed', String(state.sevOn[sev])); renderIssues(); };
  $('filters').appendChild(b);
});

function renderIssues(){
  const list = $('issueList'); list.textContent = '';
  DATA.findings.forEach((f, i) => {
    if (!state.sevOn[f.sev]) return;
    const b = document.createElement('button');
    b.className = 'item i' + f.sev;
    b.setAttribute('aria-selected', String(state.sel === i));
    const mt = ['<span class="rule"></span>'];
    if (f.anim) mt.push('<span class="num">' + f.anim + '</span>');
    if (f.t != null) mt.push('<span class="num">' + f.t.toFixed(2) + ' s</span>');
    if (f.bones && f.bones.length) mt.push('<span>' + f.bones.length + ' 根骨骼</span>');
    b.innerHTML = '<span class="badge b' + f.sev + '">' + f.sev + '</span>' +
      '<span><h3></h3><p></p><span class="mt">' + mt.join('') + '</span></span>';
    b.querySelector('h3').textContent = f.rule + ' · ' + f.target;
    b.querySelector('p').textContent = f.msg;
    b.querySelector('.rule').textContent = SEV_NAME[f.sev];
    b.onclick = () => pick(i);
    list.appendChild(b);
  });
}

function pick(i){
  state.sel = i;
  const f = DATA.findings[i];
  if (f.anim && DATA.animations[f.anim]) {
    selectAnim(f.anim, true);
    if (f.bones && f.bones.length) setMode('seam');
    else if (f.t != null) state.frame = Math.round(f.t * DATA.animations[f.anim].fps);
  }
  renderIssues(); draw(); syncTime();
}

/* ---------- animation selection ---------- */
function selectAnim(name, keep){
  state.anim = name;
  state.frame = firstLiveFrame(DATA.animations[name]);
  if (!keep) state.sel = null;
  document.querySelectorAll('#animList .node').forEach(n =>
    n.setAttribute('aria-selected', String(n.dataset.anim === name)));
  const a = DATA.animations[name];
  $('vbAnim').textContent = name;
  $('vbFps').textContent = a.fps + ' fps · ' + a.frames + ' 格';
  $('tlmeta').innerHTML = '<span class="num">' + a.duration.toFixed(2) + ' s</span>' +
    '<span class="num">' + Object.keys(a.vis).length + ' 個可見 slot</span>';
  buildRail(); renderIssues(); syncTime(); draw();
}

function buildRail(){
  const a = DATA.animations[state.anim];
  const rail = $('rail');
  rail.querySelectorAll('.marker').forEach(m => m.remove());
  $('ruler').textContent = '';
  for (let i = 0; i <= 4; i++){
    const s = document.createElement('span');
    s.className = 'num';
    s.textContent = (a.duration * i / 4).toFixed(2);
    $('ruler').appendChild(s);
  }
  DATA.findings.forEach((f, i) => {
    if (f.anim !== state.anim || f.t == null) return;
    const m = document.createElement('button');
    m.className = 'marker m' + f.sev;
    m.style.left = Math.min(100, (f.t / a.duration) * 100) + '%';
    m.innerHTML = '<span class="badge b' + f.sev + '">' + f.sev + '</span>';
    m.title = f.rule;
    m.onclick = e => { e.stopPropagation(); pick(i); };
    rail.appendChild(m);
  });
}

/* Pointer capture so a drag keeps scrubbing after the cursor leaves the rail. */
let scrubbing = false;
function scrubTo(clientX){
  const a = DATA.animations[state.anim];
  const r = $('rail').getBoundingClientRect();
  const f = Math.round(((clientX - r.left) / r.width) * (a.frames - 1));
  const clamped = Math.max(0, Math.min(a.frames - 1, f));
  if (clamped === state.frame) return;
  state.frame = clamped;
  syncTime(); draw();
}
$('rail').addEventListener('pointerdown', e => {
  if (e.target.closest('.marker')) return;
  scrubbing = true;
  state.playing = false;
  $('rail').setPointerCapture(e.pointerId);
  if (state.mode !== 'play') setMode('play');
  scrubTo(e.clientX);
});
$('rail').addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
$('rail').addEventListener('pointerup', e => {
  scrubbing = false;
  if ($('rail').hasPointerCapture(e.pointerId)) $('rail').releasePointerCapture(e.pointerId);
});
$('rail').addEventListener('pointercancel', () => { scrubbing = false; });

function syncTime(){
  const a = DATA.animations[state.anim];
  $('playhead').style.left = (state.frame / (a.frames - 1)) * 100 + '%';
  $('tc').innerHTML = (state.frame / a.fps).toFixed(2) +
    ' <span>/ ' + a.duration.toFixed(2) + ' s</span>';
}

/* ---------- modes ---------- */
function setMode(m){
  state.mode = m;
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('legend').classList.toggle('on', m === 'seam');
  draw();
}
document.querySelectorAll('[data-mode]').forEach(b =>
  b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-flag]').forEach(b => b.onclick = () => {
  state.hideDead = !state.hideDead;
  b.setAttribute('aria-pressed', String(state.hideDead)); draw();
});

/* ---------- drawing ---------- */
function liveBones(a, frame){
  const set = new Set();
  for (const slot in a.vis) if (a.vis[slot][frame]) set.add(a.slotBone[slot]);
  if (!state.hideDead) a.bones.forEach(b => set.add(b.name));
  // a live bone keeps its whole parent chain visible
  const byName = {}; a.bones.forEach(b => byName[b.name] = b);
  for (const n of Array.from(set)){
    let p = byName[n] && byName[n].parent;
    while (p && !set.has(p)) { set.add(p); p = byName[p] && byName[p].parent; }
  }
  // Transient effects (a fade-in "wild") show nothing at frame 0. Draw the whole
  // rig rather than a blank canvas — an empty stage reads as a broken tool.
  if (!set.size) a.bones.forEach(b => set.add(b.name));
  return set;
}

function firstLiveFrame(a){
  for (let i = 0; i < a.frames; i++)
    for (const slot in a.vis) if (a.vis[slot][i]) return i;
  return 0;
}

/* Bounds are computed ONCE per animation over every frame, then cached.
 * Re-fitting per frame made the whole figure drift under the cursor while
 * scrubbing — that wobble is what reads as "not smooth", not the frame rate. */
const boundsCache = new Map();
const liveCache = new Map();

function liveCached(a, fr){
  const k = state.anim + '|' + state.hideDead + '|' + fr;
  let v = liveCache.get(k);
  if (!v){ v = liveBones(a, fr); liveCache.set(k, v); }
  return v;
}

function boundsOf(a){
  const key = state.anim + '|' + state.hideDead;
  if (boundsCache.has(key)) return boundsCache.get(key);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, any = false;
  for (let fr = 0; fr < a.frames; fr++){
    const live = liveCached(a, fr);
    for (const b of a.bones){
      if (!live.has(b.name)) continue;
      const [x, y] = b.f[fr];
      any = true;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  const pad = any ? Math.max(60, (x1 - x0 + y1 - y0) * 0.08) : 0;
  const bb = any ? [x0 - pad, y0 - pad, x1 + pad, y1 + pad] : null;
  boundsCache.set(key, bb);
  return bb;
}

function drawPose(a, frame, colour, alpha, dim){
  const live = liveCached(a, frame);
  const byName = {}; a.bones.forEach(b => byName[b.name] = b);
  ctx.save(); ctx.globalAlpha = alpha;
  a.bones.forEach(b => {
    if (!live.has(b.name)) return;
    const [x, y, ang, len] = b.f[frame];
    const [sx, sy] = P(x, y);
    if (len > 0.5){
      const r = ang * Math.PI / 180;
      const [ex, ey] = P(x + Math.cos(r) * len, y + Math.sin(r) * len);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
      ctx.strokeStyle = colour; ctx.lineWidth = dim ? 1 : 1.6; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(sx, sy, dim ? 1.4 : 2.2, 0, 6.284);
    ctx.fillStyle = colour; ctx.fill();
    const p = byName[b.name] && byName[b.name].parent;
    if (p && live.has(p)){
      const [px, py] = P(byName[p].f[frame][0], byName[p].f[frame][1]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy);
      ctx.strokeStyle = colour; ctx.globalAlpha = alpha * 0.28;
      ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = alpha;
    }
  });
  ctx.restore();
}

let P = (x, y) => [x, y];

let rafPending = false;
function draw(){                       // coalesce to one paint per frame
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; paint(); });
}

function paint(){
  const a = DATA.animations[state.anim];
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (cv.width !== cw || cv.height !== ch){   // reallocating every frame stalls
    cv.width = cw; cv.height = ch;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const last = a.frames - 1;
  const seam = state.mode === 'seam';
  const bb = boundsOf(a);

  $('emptyMsg').hidden = !!bb;
  if (!bb){ $('emptyMsg').textContent = '這支動畫沒有可見的骨骼可以繪製'; return; }

  const [bx0, by0, bx1, by1] = bb;
  const s = Math.min(w / (bx1 - bx0), h / (by1 - by0));
  const ox = (w - (bx1 - bx0) * s) / 2, oy = (h - (by1 - by0) * s) / 2;
  P = (x, y) => [(x - bx0) * s + ox, h - ((y - by0) * s + oy)];

  // ground line at y = 0
  const [, gy] = P(0, 0);
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy);
  ctx.strokeStyle = 'oklch(100% 0 0 / .09)'; ctx.lineWidth = 1; ctx.stroke();

  if (state.mode === 'trail'){
    for (let i = 0; i < a.frames; i++)
      drawPose(a, i, col('--c-text'), 0.10, true);
    drawPose(a, state.frame, col('--c-text'), 1, false);
    return;
  }
  if (!seam){ drawPose(a, state.frame, col('--c-text'), 1, false); return; }

  drawPose(a, 0,    col('--seam-a'), 0.95, false);
  drawPose(a, last, col('--seam-b'), 0.95, false);

  // connect the two poses wherever the gap is large and the part is visible
  const flagged = new Set(
    (state.sel != null && DATA.findings[state.sel].bones) || []);
  const live0 = liveCached(a, 0), liveN = liveCached(a, last);
  let worst = 0, worstName = '';
  a.bones.forEach(b => {
    if (!live0.has(b.name) || !liveN.has(b.name)) return;
    const A = b.f[0], B = b.f[last];
    const d = Math.hypot(B[0] - A[0], B[1] - A[1]);
    if (d < 12 && !flagged.has(b.name)) return;
    if (d > worst){ worst = d; worstName = b.name; }
    const [ax, ay] = P(A[0], A[1]), [nx, ny] = P(B[0], B[1]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(nx, ny);
    ctx.strokeStyle = col('--sev-1');
    ctx.lineWidth = flagged.has(b.name) ? 2 : 1;
    ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
    if (flagged.has(b.name)){
      ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 6.284);
      ctx.strokeStyle = col('--sev-1'); ctx.lineWidth = 1.6; ctx.stroke();
      ctx.font = '11px ' + CSS.getPropertyValue('--font-mono');
      ctx.fillStyle = col('--sev-1');
      ctx.fillText(b.name + '  Δ' + Math.round(d), nx + 7, ny - 5);
    }
  });
  $('status').innerHTML = statusLine(a) +
    (worstName ? ' <span>最大位移 <b>' + worstName + '</b> ' +
      '<b class="num">' + Math.round(worst) + '</b> 單位</span>' : '');
}

function statusLine(a){
  return '<span>動畫 <b>' + state.anim + '</b></span>' +
         '<span class="num">' + a.frames + ' 格 @ ' + a.fps + ' fps</span>' +
         '<span>模式 <b>' + ({play:'逐格',seam:'首尾疊圖',trail:'軌跡'})[state.mode] + '</b></span>' +
         '<span style="margin-left:auto">本機 · 未上傳</span>';
}

/* ---------- transport ---------- */
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
function step(d){
  const a = DATA.animations[state.anim];
  state.frame = (state.frame + d + a.frames) % a.frames;
  setMode('play'); syncTime(); draw();
}
$('play').onclick = () => {
  state.playing = !state.playing;
  if (state.playing){ acc = 0; prevT = 0; setMode('play'); requestAnimationFrame(tick); }
};
let acc = 0, prevT = 0;
function tick(ts){
  if (!state.playing) return;
  const a = DATA.animations[state.anim];
  if (prevT) acc += Math.min(0.25, (ts - prevT) / 1000);
  prevT = ts || 0;
  while (acc >= 1 / a.fps){ acc -= 1 / a.fps; state.frame = (state.frame + 1) % a.frames; }
  syncTime(); draw();
  requestAnimationFrame(tick);
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});
addEventListener('resize', draw);

/* ---------- go ---------- */
renderIssues();
const firstFlagged = DATA.findings.find(f => f.anim && DATA.animations[f.anim]);
selectAnim(firstFlagged ? firstFlagged.anim : animNames[0]);
$('status').innerHTML = statusLine(DATA.animations[state.anim]);
</script>
</body>
</html>
